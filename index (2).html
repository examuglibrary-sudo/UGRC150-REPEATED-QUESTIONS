<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UGRC 150 Repeating IA Questions 2026</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e8eef5;
        }

        /* ===== MAIN CONTAINER ===== */
        #app-wrapper {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
        }

        /* ===== CUSTOM HEADER ===== */
        #custom-header {
            background: #0b427b;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 52px;
            z-index: 10;
            border-bottom: 3px solid #ffd700;
        }
        #custom-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #custom-header .brand .uni-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }
        #custom-header .brand .uni-name span {
            font-weight: 300;
            color: #ffd700;
        }
        #custom-header .brand .badge {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 14px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #custom-header .profile-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffd700;
            color: #0b427b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ===== IFRAME CONTAINER ===== */
        #iframe-container {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
        }

        /* ===== LOADING OVERLAY ===== */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e6edf4;
            border-top: 5px solid #0b427b;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-overlay p {
            margin-top: 16px;
            color: #0b427b;
            font-size: 16px;
            font-weight: 600;
        }
        #loading-overlay .sub-text {
            font-size: 13px;
            color: #6a7e94;
            font-weight: 400;
            margin-top: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #custom-header { padding: 6px 12px; min-height: 44px; }
            #custom-header .brand .uni-name { font-size: 15px; }
            #custom-header .brand .badge { display: none; }
            #custom-header .profile-circle { width: 30px; height: 30px; font-size: 11px; }
            #loading-overlay p { font-size: 14px; }
            #loading-overlay .spinner { width: 40px; height: 40px; }
        }
        @media (max-width: 480px) {
            #custom-header { padding: 4px 10px; min-height: 38px; }
            #custom-header .brand .uni-name { font-size: 13px; }
            #custom-header .profile-circle { width: 26px; height: 26px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">

        <!-- ===== CUSTOM HEADER ===== -->
        <header id="custom-header">
            <div class="brand">
                <div class="uni-name">UNIVERSITY OF <span>GHANA</span></div>
                <div class="badge">UGRC 150</div>
            </div>
            <div class="profile-circle">ES</div>
        </header>

        <!-- ===== IFRAME CONTAINER ===== -->
        <div id="iframe-container">

            <!-- Loading Overlay -->
            <div id="loading-overlay">
                <div class="spinner"></div>
                <p>📚 Loading Assessment...</p>
                <div class="sub-text">Please wait while we prepare your questions</div>
            </div>

            <!-- Iframe with your deployed Apps Script URL -->
            <iframe
                id="app-iframe"
                src="https://script.google.com/macros/s/AKfycby2UA2vyVvhRKpxIHnIWodTzPg8KvKbtiSS0YVdUsyXuFHUDCB3hkdCNwSqU1FMlaMY/exec"
                allow="fullscreen"
                loading="lazy"
                sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
                referrerpolicy="no-referrer"
            ></iframe>

        </div>

    </div>

    <script>
        // ============================================================
        // HIDE LOADING OVERLAY ONCE IFRAME LOADS
        // ============================================================

        var iframe = document.getElementById('app-iframe');
        var overlay = document.getElementById('loading-overlay');

        // Hide loading when iframe loads
        iframe.addEventListener('load', function() {
            // Small delay to ensure smooth transition
            setTimeout(function() {
                overlay.classList.add('hidden');
            }, 500);
        });

        // Fallback: hide after 8 seconds even if iframe doesn't trigger load
        setTimeout(function() {
            overlay.classList.add('hidden');
        }, 8000);

        // ============================================================
        // HANDLE IFRAME RESIZE ON MOBILE
        // ============================================================

        function resizeIframe() {
            var container = document.getElementById('iframe-container');
            var height = window.innerHeight - document.getElementById('custom-header').offsetHeight;
            container.style.height = height + 'px';
        }

        window.addEventListener('resize', resizeIframe);
        window.addEventListener('orientationchange', function() {
            setTimeout(resizeIframe, 300);
        });

        // Initial resize
        setTimeout(resizeIframe, 100);

        // ============================================================
        // HANDLE LOADING ERRORS
        // ============================================================

        iframe.addEventListener('error', function() {
            overlay.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                    <h3 style="color:#0b427b;">Unable to Load Assessment</h3>
                    <p style="color:#6a7e94;margin-top:8px;">Please check your internet connection and try again.</p>
                    <button onclick="location.reload()" style="margin-top:16px;padding:10px 30px;background:#0b427b;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;">
                        🔄 Retry
                    </button>
                </div>
            `;
            overlay.classList.remove('hidden');
        });
    </script>

</body>
</html>
